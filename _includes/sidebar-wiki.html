<div class="sidebar" itemscope itemtype="http://schema.org/BlogPosting">
  <div>
    <ul>
    {% for item in include.nav %}
      <li><a href="{{ item.url }}">{{ item.title }}</a>
        {% if item.subnav %}
          {% include nav.html nav=item.subnav %}
        {% endif %}
      </li>
    {% endfor %}
  </ul>
  </div>
</div>
